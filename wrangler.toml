name = "scrypt-benchmark"
main = "src/index.ts"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[observability.logs]
invocation_logs = true
head_sampling_rate = 1

[[ratelimits]]
name = "BENCHMARK_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 100
period = 60
